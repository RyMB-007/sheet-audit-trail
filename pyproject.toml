[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sheet-audit-trail"
version = "0.1.0"
description = "Audit-grade diffs for Excel workbooks and Google Sheets, posted to GitHub pull requests."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
gsheets = ["google-auth>=2.20", "requests>=2.31"]
test = ["pytest>=7"]

[project.scripts]
sheetaudit = "sheetaudit.cli:main"

[tool.setuptools]
packages = ["sheetaudit"]
